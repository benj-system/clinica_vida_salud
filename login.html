<!-- login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clínica Vida Salud</title>
    <!-- Enlazamos el CSS externo -->
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="img/iconCVS.png">
</head>
<body>

<div class="login-box">
    <h2>Clínica Vida Salud</h2>
    
    <!-- Aquí se mostrará el error si el login falla -->
    {{MENSAJE_ERROR}}

    <!-- El action apunta a index.php para que el formulario se envíe a la lógica -->
    <form method="POST" action="index.php">
        <div class="form-group">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Ingresar</button>
    </form>
</div>

</body>
</html>
